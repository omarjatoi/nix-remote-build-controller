[package]
name = "controller"
description = "Kubernetes controller that runs a builder pod for each NixBuildRequest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "controller"
path = "src/main.rs"
# The library docs cover the code; a binary page would collide with them.
doc = false

[dependencies]
anyhow.workspace = true
api.workspace = true
axum.workspace = true
clap.workspace = true
common.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
opentelemetry.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
common = { workspace = true, features = ["testing"] }
api = { workspace = true, features = ["testing"] }
http.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true
