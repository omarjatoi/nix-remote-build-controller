[package]
name = "proxy"
description = "SSH server that forwards each Nix build session to its own builder pod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "proxy"
path = "src/main.rs"
# The library docs cover the code; a binary page would collide with them.
doc = false

[dependencies]
anyhow.workspace = true
api.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
common.workspace = true
getrandom.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
russh.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
api = { workspace = true, features = ["testing"] }
controller.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
