{{- with .Values.sshKeys -}}
{{- if .create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "nrbc.labels" (dict "context" $ "component" "ssh-keys") | nindent 4 }}
type: Opaque
data:
  private: {{ required "sshKeys.create is true, so set sshKeys.private" .private | b64enc }}
  public: {{ required "sshKeys.create is true, so set sshKeys.public" .public | b64enc }}
  {{- with .builderHostKey }}
  builder-host-key: {{ . | b64enc }}
  {{- end }}
  {{- with .hostKey }}
  host-key: {{ . | b64enc }}
  {{- end }}
  {{- with .clientAuthorizedKeys }}
  client-authorized-keys: {{ . | b64enc }}
  {{- end }}
{{- end -}}
{{- end -}}
