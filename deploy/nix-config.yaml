apiVersion: v1
kind: ConfigMap
metadata:
  name: nix-builder-config
  namespace: default
data:
  # nix.conf for every builder pod (mounted at /etc/nix). These settings apply to
  # one pod. The number of pods comes from the client's maxJobs (see README).
  nix.conf: |
    experimental-features = nix-command flakes
    sandbox = false
    trusted-users = root nixbld
    # A pod builds one derivation at a time. Use cores to make it faster.
    max-jobs = 1
    # 0 means all CPU cores that the pod can use.
    cores = 0
    # Download cached dependencies in the pod, not through the client.
    substituters = https://cache.nixos.org
    builders-use-substitutes = true
    # OpenTelemetry settings, if any (see deploy/components/otel).
    !include otlp.conf
