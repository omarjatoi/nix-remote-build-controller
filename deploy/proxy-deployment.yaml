apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: default
  labels:
    component: proxy
spec:
  type: LoadBalancer
  ports:
    - port: 22
      targetPort: 2222
      protocol: TCP
      name: ssh
  selector:
    component: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: default
  labels:
    component: proxy
spec:
  replicas: 1
  # One proxy pod at a time. To run more replicas, see "High availability" in
  # the README.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: proxy
  template:
    metadata:
      labels:
        component: proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: nix-remote-build-controller
      # Lets running builds finish when the pod stops. Keep this longer than
      # --shutdown-timeout.
      terminationGracePeriodSeconds: 1830
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: proxy
          imagePullPolicy: Always
          args:
            - --port=2222
            - --health-port=8080
            - --metrics-addr=:8082
            - --namespace=default
            - --remote-user=nixbld
            - --remote-port=22
            - --ssh-key-secret=nix-builder-ssh-keys
            - --pod-ready-timeout=5m
            - --build-timeout=1h
            - --shutdown-timeout=30m
            - --keepalive-interval=30s
            - --log-level=info
          env:
            # Build requests point to this pod as their owner, so Kubernetes
            # deletes them (and their builder pods) if this pod is deleted.
            - name: PROXY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROXY_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 2222
              name: ssh
            - containerPort: 8080
              name: health
            - containerPort: 8082
              name: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
