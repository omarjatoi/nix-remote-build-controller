apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: default
  labels:
    component: proxy
spec:
  type: LoadBalancer
  ports:
    - port: 22
      targetPort: 2222
      protocol: TCP
      name: ssh
  selector:
    component: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: default
  labels:
    component: proxy
spec:
  replicas: 1
  # Each proxy pod owns the NixBuildRequests it creates (via ownerReferences), so
  # rolling a new pod in before the old one drains would orphan in-flight builds.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: proxy
  template:
    metadata:
      labels:
        component: proxy
    spec:
      serviceAccountName: nix-remote-build-controller
      # Give in-flight builds time to finish when the pod is deleted; must be >=
      # the proxy's --shutdown-timeout.
      terminationGracePeriodSeconds: 1830
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proxy
          image: proxy
          imagePullPolicy: Always
          args:
            - --port=2222
            - --health-port=8080
            - --namespace=default
            - --remote-user=nixbld
            - --remote-port=22
            - --ssh-key-secret=nix-builder-ssh-keys
            - --pod-ready-timeout=5m
            - --build-timeout=1h
            - --shutdown-timeout=30m
            - --keepalive-interval=30s
            - --log-level=info
          env:
            # Used to set ownerReferences on NixBuildRequests so they (and their
            # builder pods) are garbage-collected if this proxy pod dies.
            - name: PROXY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PROXY_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          ports:
            - containerPort: 2222
              name: ssh
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
