# All SSH keys, in one secret. Only "private" and "public" are necessary.
#
#   private                 (necessary) key that the proxy uses to log in to builder pods
#   public                  (necessary) the matching public key; builder pods accept it
#   builder-host-key        (recommended) host key of all builder pods; the proxy checks it
#   client-authorized-keys  (recommended) public keys of the clients that can connect;
#                           if missing, every client can connect
#   host-key                (recommended) host key of the proxy; if missing, the proxy
#                           makes a new key at each start
#
# Make the keys:
#   ssh-keygen -t ed25519 -f nixbld       -N "" -C nixbld        # proxy <-> builder
#   ssh-keygen -t ed25519 -f builder-host -N "" -C builder-host  # builder host key
#   ssh-keygen -t ed25519 -f proxy-host   -N "" -C proxy-host    # proxy host key
#   ssh-keygen -t ed25519 -f client       -N "" -C nix-client    # a client key
#
# Make the secret from the key files:
#   kubectl create secret generic nix-builder-ssh-keys \
#     --from-file=private=nixbld \
#     --from-file=public=nixbld.pub \
#     --from-file=builder-host-key=builder-host \
#     --from-file=host-key=proxy-host \
#     --from-file=client-authorized-keys=client.pub
#
# Or fill in the template below.
apiVersion: v1
kind: Secret
metadata:
  name: nix-builder-ssh-keys
  namespace: default
  labels:
    app.kubernetes.io/name: nix-remote-build-controller
    app.kubernetes.io/component: ssh-keys
type: Opaque
stringData:
  private: |
    <PROXY_PRIVATE_KEY_PEM>
  public: |
    <PROXY_PUBLIC_KEY>
  builder-host-key: |
    <BUILDER_HOST_PRIVATE_KEY_PEM>
  client-authorized-keys: |
    <CLIENT_PUBLIC_KEY_1>
    <CLIENT_PUBLIC_KEY_2>
