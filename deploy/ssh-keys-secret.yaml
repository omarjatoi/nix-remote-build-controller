# SSH key material for the Nix remote build controller.
#
# A single secret holds every key the system needs. Only "private" and "public"
# are required; the other entries harden the deployment and are recommended.
#
#   private                 (required) proxy's private key for authenticating TO builder pods
#   public                  (required) matching public key, mounted as authorized_keys IN builder pods
#   builder-host-key        (recommended) ed25519 host key shared by all builder pods, so the
#                           proxy can verify builders instead of trusting any key
#   client-authorized-keys  (recommended) authorized_keys of Nix clients allowed to use the proxy;
#                           if absent, client authentication is DISABLED (see the README)
#   host-key                (optional) stable host key the proxy presents to clients; if absent an
#                           ephemeral key is generated and clients see it change on every restart
#
# Generate keys:
#   ssh-keygen -t ed25519 -f nixbld       -N "" -C nixbld        # proxy <-> builder
#   ssh-keygen -t ed25519 -f builder-host -N "" -C builder-host  # builder host key
#   ssh-keygen -t ed25519 -f proxy-host   -N "" -C proxy-host    # proxy host key
#   ssh-keygen -t ed25519 -f client       -N "" -C nix-client    # a client key
#
# Create the secret from files (preferred over editing base64 by hand):
#   kubectl create secret generic nix-builder-ssh-keys \
#     --from-file=private=nixbld \
#     --from-file=public=nixbld.pub \
#     --from-file=builder-host-key=builder-host \
#     --from-file=host-key=proxy-host \
#     --from-file=client-authorized-keys=client.pub
#
# The manifest below is a template if you prefer to manage it declaratively.
apiVersion: v1
kind: Secret
metadata:
  name: nix-builder-ssh-keys
  namespace: default
  labels:
    app.kubernetes.io/name: nix-remote-build-controller
    app.kubernetes.io/component: ssh-keys
type: Opaque
stringData:
  private: |
    <PROXY_PRIVATE_KEY_PEM>
  public: |
    <PROXY_PUBLIC_KEY>
  builder-host-key: |
    <BUILDER_HOST_PRIVATE_KEY_PEM>
  client-authorized-keys: |
    <CLIENT_PUBLIC_KEY_1>
    <CLIENT_PUBLIC_KEY_2>
