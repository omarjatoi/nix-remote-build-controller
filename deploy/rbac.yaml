apiVersion: v1
kind: ServiceAccount
metadata:
  name: nix-remote-build-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nix-remote-build-controller
rules:
  # Builder pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # nix.conf ConfigMap and SSH key secret (read only).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Events that the controller records on build requests.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Build requests and their status.
  - apiGroups: ["nix.io"]
    resources: ["nixbuildrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["nix.io"]
    resources: ["nixbuildrequests/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nix-remote-build-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nix-remote-build-controller
subjects:
  - kind: ServiceAccount
    name: nix-remote-build-controller
    namespace: default
---
# Leader election lease. Used only with --leader-elect.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nix-remote-build-controller-leader-election
  namespace: default
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nix-remote-build-controller-leader-election
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nix-remote-build-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: nix-remote-build-controller
    namespace: default
